<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buildly - Checklist de Testes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f1ed;
      padding: 20px;
      color: #2c2620;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
      color: #2c2620;
      font-size: 1.8em;
    }
    .info {
      color: #8b7e6f;
      margin-bottom: 20px;
      font-size: 0.9em;
    }
    .test-group {
      margin-bottom: 30px;
      border-left: 4px solid #e08860;
      padding-left: 20px;
    }
    .test-group h2 {
      font-size: 1.1em;
      margin-bottom: 15px;
      color: #2c2620;
    }
    .test-case {
      background: #faf8f5;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #e8dfd7;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .test-case input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #8fbf9f;
    }
    .test-case label {
      cursor: pointer;
      flex: 1;
    }
    .test-case input:checked + label {
      text-decoration: line-through;
      color: #a89e8c;
    }
    .test-case.pass input:checked + label {
      color: #8fbf9f;
      text-decoration: line-through;
    }
    .test-case.fail input:checked + label {
      color: #e08f76;
      text-decoration: line-through;
    }
    .test-name {
      font-weight: 500;
      display: block;
    }
    .test-desc {
      font-size: 0.85em;
      color: #8b7e6f;
      margin-top: 4px;
    }
    .progress {
      margin: 20px 0;
      padding: 15px;
      background: #f5f1ed;
      border-radius: 4px;
    }
    .progress-bar {
      height: 8px;
      background: #e8dfd7;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8fbf9f, #e08860);
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 0.9em;
      color: #8b7e6f;
      text-align: center;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95em;
      transition: all 0.2s;
    }
    .btn-export {
      background: #e08860;
      color: white;
    }
    .btn-export:hover {
      background: #eda07f;
    }
    .btn-reset {
      background: #e8dfd7;
      color: #2c2620;
    }
    .btn-reset:hover {
      background: #d4cac1;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .summary-item {
      text-align: center;
      padding: 15px;
      background: #f5f1ed;
      border-radius: 4px;
    }
    .summary-item .number {
      font-size: 1.8em;
      font-weight: bold;
      color: #e08860;
      display: block;
    }
    .summary-item .label {
      font-size: 0.85em;
      color: #8b7e6f;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Buildly - Checklist de Testes E2E</h1>
    <div class="info">
      Marque cada teste conforme for executando. Progresso é salvo automaticamente no navegador.
    </div>

    <div class="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0 de 18 testes concluídos (0%)</div>
    </div>

    <!-- Fluxos Principais -->
    <div class="test-group">
      <h2>1️⃣ Fluxos Principais</h2>

      <div class="test-case">
        <input type="checkbox" id="ct001" class="test-input">
        <label for="ct001">
          <span class="test-name">CT-001: Novo Colaborador</span>
          <span class="test-desc">Criar novo colaborador com todos 20 campos → deve aparecer na lista</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct005" class="test-input">
        <label for="ct005">
          <span class="test-name">CT-005: Editar Colaborador</span>
          <span class="test-desc">Abrir, modificar dados, salvar → tabela atualiza</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct006" class="test-input">
        <label for="ct006">
          <span class="test-name">CT-006: Ver Detalhes</span>
          <span class="test-desc">Clicar detalhes → modal com todos 20 campos</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct007" class="test-input">
        <label for="ct007">
          <span class="test-name">CT-007: Remover Colaborador</span>
          <span class="test-desc">Clicar remover → confirmar → remove da tabela</span>
        </label>
      </div>
    </div>

    <!-- Validações -->
    <div class="test-group">
      <h2>✅ Validações</h2>

      <div class="test-case">
        <input type="checkbox" id="ct002" class="test-input">
        <label for="ct002">
          <span class="test-name">CT-002: Validação - Nome Obrigatório</span>
          <span class="test-desc">Deixar nome vazio → erro "Nome é obrigatório"</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct003" class="test-input">
        <label for="ct003">
          <span class="test-name">CT-003: Validação - Data Demissão</span>
          <span class="test-desc">Demissão anterior a admissão → erro</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct004" class="test-input">
        <label for="ct004">
          <span class="test-name">CT-004: Validação - Matrícula Única</span>
          <span class="test-desc">Inserir matrícula duplicada → erro no banco</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct015" class="test-input">
        <label for="ct015">
          <span class="test-name">CT-015: Navegação Entre Abas</span>
          <span class="test-desc">Clicar abas → dados preservados, interface responde</span>
        </label>
      </div>
    </div>

    <!-- Filtros e Busca -->
    <div class="test-group">
      <h2>🔍 Filtros e Busca</h2>

      <div class="test-case">
        <input type="checkbox" id="ct008" class="test-input">
        <label for="ct008">
          <span class="test-name">CT-008: Filtro - Busca por Nome</span>
          <span class="test-desc">Digitar nome → filtra em tempo real</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct009" class="test-input">
        <label for="ct009">
          <span class="test-name">CT-009: Filtro - Por Empresa</span>
          <span class="test-desc">Selecionar empresa → lista filtra</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct010" class="test-input">
        <label for="ct010">
          <span class="test-name">CT-010: Filtro - Por Situação</span>
          <span class="test-desc">Selecionar situação (ativo/inativo) → filtra</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct011" class="test-input">
        <label for="ct011">
          <span class="test-name">CT-011: Filtro - Por Frente</span>
          <span class="test-desc">Selecionar frente de serviço → filtra</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct012" class="test-input">
        <label for="ct012">
          <span class="test-name">CT-012: Ordenação</span>
          <span class="test-desc">Testar 5 tipos de ordenação (nome, cargo, data, etc)</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct013" class="test-input">
        <label for="ct013">
          <span class="test-name">CT-013: Filtros Combinados</span>
          <span class="test-desc">Usar múltiplos filtros simultaneamente → combina corretamente</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct014" class="test-input">
        <label for="ct014">
          <span class="test-name">CT-014: Estatísticas Dashboard</span>
          <span class="test-desc">Verificar se os números (total, ativos, MOD, MOI) estão corretos</span>
        </label>
      </div>
    </div>

    <!-- UX e Integração -->
    <div class="test-group">
      <h2>🎨 UX e Integração</h2>

      <div class="test-case">
        <input type="checkbox" id="ct016" class="test-input">
        <label for="ct016">
          <span class="test-name">CT-016: Responsividade</span>
          <span class="test-desc">Testar desktop, tablet, mobile → layout funciona</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct017" class="test-input">
        <label for="ct017">
          <span class="test-name">CT-017: Tema Claro/Escuro</span>
          <span class="test-desc">Alternar tema → cores e contraste OK</span>
        </label>
      </div>

      <div class="test-case">
        <input type="checkbox" id="ct018" class="test-input">
        <label for="ct018">
          <span class="test-name">CT-018: Integração com Efetivo</span>
          <span class="test-desc">Novo colaborador aparece em "Efetivo", marca presença funciona</span>
        </label>
      </div>
    </div>

    <!-- Resumo -->
    <div class="summary">
      <div class="summary-item">
        <span class="number" id="totalTestes">0</span>
        <span class="label">Total</span>
      </div>
      <div class="summary-item">
        <span class="number" id="testesConcluidos">0</span>
        <span class="label">Concluídos</span>
      </div>
      <div class="summary-item">
        <span class="number" id="percentual">0%</span>
        <span class="label">Progresso</span>
      </div>
    </div>

    <!-- Botões -->
    <div class="btn-group">
      <button class="btn-export" onclick="exportarResultados()">📥 Exportar Resultados</button>
      <button class="btn-reset" onclick="limparTodos()">🔄 Resetar Tudo</button>
    </div>
  </div>

  <script>
    const testInputs = document.querySelectorAll('.test-input');
    const totalTestes = testInputs.length;

    document.getElementById('totalTestes').textContent = totalTestes;

    // Carregar estado salvo
    testInputs.forEach(input => {
      const saved = localStorage.getItem(input.id);
      if (saved) input.checked = true;
    });

    // Atualizar progresso
    function atualizarProgresso() {
      const concluidos = document.querySelectorAll('.test-input:checked').length;
      const percentual = Math.round((concluidos / totalTestes) * 100);

      document.getElementById('testesConcluidos').textContent = concluidos;
      document.getElementById('percentual').textContent = percentual + '%';
      document.getElementById('progressFill').style.width = percentual + '%';
      document.getElementById('progressText').textContent =
        `${concluidos} de ${totalTestes} testes concluídos (${percentual}%)`;
    }

    // Listeners
    testInputs.forEach(input => {
      input.addEventListener('change', () => {
        if (input.checked) {
          localStorage.setItem(input.id, 'true');
        } else {
          localStorage.removeItem(input.id);
        }
        atualizarProgresso();
      });
    });

    // Exportar resultados
    function exportarResultados() {
      const concluidos = Array.from(testInputs)
        .filter(input => input.checked)
        .map(input => input.id)
        .join(', ');

      const texto = `
=== RESULTADO DOS TESTES BUILDLY ===
Data: ${new Date().toLocaleString('pt-BR')}
Testes Concluídos: ${document.getElementById('testesConcluidos').textContent}/${totalTestes}
Progresso: ${document.getElementById('percentual').textContent}

Testes Passados:
${concluidos || 'Nenhum'}

Link para editar: https://github.com/jonacir2023/buildly
Documentação: docs/TESTES-E2E.md
`;

      navigator.clipboard.writeText(texto).then(() => {
        alert('✅ Resultados copiados para clipboard!');
      });
    }

    // Limpar tudo
    function limparTodos() {
      if (confirm('Tem certeza que deseja limpar todos os testes?')) {
        testInputs.forEach(input => {
          input.checked = false;
          localStorage.removeItem(input.id);
        });
        atualizarProgresso();
      }
    }

    // Inicializar
    atualizarProgresso();
  </script>
</body>
</html>
